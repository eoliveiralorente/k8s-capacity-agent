name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: |
          python -m pip install --requirement requirements.txt
          # test_capacity, test_health e test_tess dependem de um cluster real (kubectl)
          TESTS=$(ls test_*.py | grep -v -E '^test_(capacity|health|tess)\.py$' | sed 's/\.py$//')
          python -m unittest $TESTS
      - name: Lint dos charts Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint charts/capacity-agent charts/capacity-collector

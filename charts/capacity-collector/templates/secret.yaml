{{- if not .Values.existingSecret }}
{{- if not .Values.ingestToken }}
{{- fail "Defina ingestToken (gerado no painel) ou existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collector.secretName" . }}
  labels: {{- include "collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.ingestToken | quote }}
{{- end }}

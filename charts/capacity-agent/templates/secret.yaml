{{- if not .Values.encryption.existingSecret }}
{{- $name := include "ca.keySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ca.labels" . | nindent 4 }}
  annotations:
    # Nunca apagar: sem esta chave os dados cifrados ficam ilegíveis.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "key") }}
  key: {{ index $existing.data "key" }}
  {{- else }}
  key: {{ randBytes 32 | b64enc | replace "+" "-" | replace "/" "_" | b64enc }}
  {{- end }}
{{- end }}
